name: APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Une seule compilation à la fois : si vous poussez trois fois de suite,
# les deux premières sont abandonnées au lieu d'attendre en file.
# C'est ce qui bloquait le run #36.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # sans cela, un exécuteur coincé attend six heures

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle           # évite de retélécharger Gradle à chaque fois

      # Contrôles automatiques AVANT tout le reste (v134) : une faute détectée ici
      # coûte une minute au lieu de toute la compilation. Détail : outils/controles.sh
      # v178 : les tests MIDI natifs utilisent seulement la bibliothèque Rust standard.
      - uses: dtolnay/rust-toolchain@stable

      - name: Contrôles automatiques
        run: bash outils/controles.sh

      # Test de la page dans un vrai navigateur (v135) : chargement, les 29
      # machines ouvertes et jouées dans trois formats, et les corrections
      # audio, fichiers, MIDI et HTML des v124 à v132. Détail : outils/test-navigateur.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test dans un navigateur
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium > /dev/null
          python outils/test-navigateur.py
          python outils/test-export-midi.py
          python outils/test-graphique.py
          python outils/test-facades.py
          python outils/test-eurorack-focus.py
          python outils/test-menu-machines.py
          python outils/test-outils-studio.py
          python outils/test-retours-musicaux.py
          python outils/test-gestes-musicaux.py
          python outils/test-automations-machines.py
          python outils/test-ecrans-performance.py
          python outils/test-onde-smpltrek.py
          python outils/test-retours-frappe.py --rapport app/build/reports/retours-frappe.json
          python outils/test-reperes-kaoss.py --rapport app/build/reports/reperes-kaoss.json
          python outils/test-focus-mixage.py --rapport app/build/reports/focus-mixage.json
          python outils/test-editeur-sons.py --rapport app/build/reports/editeur-sons.json
          python outils/test-vue-ensemble.py --rapport app/build/reports/vue-ensemble.json
          python outils/test-ensembles-eurorack.py --rapport app/build/reports/ensembles-eurorack.json
          python outils/test-drum32.py --rapport app/build/reports/drum32.json
          python outils/test-melo32.py --rapport app/build/reports/melo32.json
          python outils/test-scenes8.py --rapport app/build/reports/scenes8.json

      # Banc de mesure du son (v148) : informatif. Compare aux mesures du dépôt
      # (docs/mesures-son.json) et joint le rapport au run ; la vue d'ensemble
      # s'affiche dans le résumé.
      - name: Mesures du son (informatif)
        continue-on-error: true
        run: |
          python outils/banc-son.py --comparer docs/mesures-son.json
          sed -n '/## Vue/,/## Détail/p' docs/mesures-son.md | sed '$d' >> "$GITHUB_STEP_SUMMARY"

      - name: Joindre les mesures du son
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesures-son
          path: docs/mesures-son.*
          if-no-files-found: ignore
          retention-days: 30

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      # Le transfert vers une vraie volca a besoin du Syro de Korg, compilé en
      # WebAssembly. Emscripten est installé à la main plutôt que par une action
      # tierce : une dépendance de moins, et le journal dit exactement où ça
      # casse. En « continue-on-error » : si quoi que ce soit manque, l'APK se
      # construit quand même et l'application annonce simplement que le
      # transfert n'est pas disponible.
      - name: Compiler le Syro en WebAssembly
        continue-on-error: true
        run: |
          set -e
          source outils/installer-emscripten.sh
          bash syro/construire.sh

      # continue-on-error rend l'échec presque invisible : une coche verte avec
      # un point d'exclamation qu'on ne remarque pas. On écrit donc noir sur
      # blanc, en tête du rapport, si le transfert est dans cet APK ou non.
      - name: État du transfert volca
        if: always()
        run: |
          if [ -f app/src/main/assets/syro/syro.js ]; then
            T=$(du -h app/src/main/assets/syro/syro.js | cut -f1)
            echo "**Transfert volca : disponible** dans cet APK ($T)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Transfert volca : absent** de cet APK — voir l'étape « Compiler le Syro »." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compiler l'APK de debug
        run: gradle assembleDebug --stacktrace --no-daemon

      # Lint d'Android (v134) : informatif pour l'instant. Il ne bloque pas, son
      # rapport est joint au run ; on décidera quoi rendre bloquant après l'avoir lu.
      - name: Lint Android (informatif)
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Joindre le rapport de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: drm16-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Le ZIP conserve tous les assets de Studio/Nexus et le Syro disponible.
      # Le HTML seul reste joint pour les anciens liens et usages simples.
      - name: Joindre la version PC
        run: |
          mkdir -p pc
          python3 outils/paquet-pc.py pc/drm16-pc.zip
          cp app/src/main/assets/drm16.html pc/drm16.html
          ls -lh pc/

      - uses: actions/upload-artifact@v7
        with:
          name: drm16-pc-complet
          path: pc/drm16-pc.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: drm16-pc-html
          path: pc/drm16.html
          if-no-files-found: error

      # En cas d'échec, on récupère les rapports : l'erreur exacte est dedans,
      # sans avoir à fouiller les journaux dans le navigateur.
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-echec
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
