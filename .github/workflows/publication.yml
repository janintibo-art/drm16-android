name: Publication

# Une publication ne part JAMAIS toute seule : elle se déclenche sur une
# étiquette de version (v83, v84…) ou à la main depuis l'onglet Actions.
# Le workflow « APK », lui, continue de compiler à chaque poussée sans rien
# publier — on n'annonce pas une version à chaque virgule corrigée.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false      # une publication en cours ne s'interrompt pas

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # v301 : même batterie navigateur que le workflow APK
    permissions:
      contents: write            # nécessaire pour créer la version et y joindre l'APK

    steps:
      - uses: actions/checkout@v7

      # v301 : une vraie publication ne doit jamais retomber silencieusement sur
      # la clé Android de debug. On vérifie aussi que les trois numéros de version
      # et, pour un push de tag, l'étiquette elle-même racontent la même chose.
      - name: Vérifier la publication
        env:
          CLE: ${{ secrets.KEYSTORE_BASE64 }}
          MDP_MAGASIN: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          MDP_CLE: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          V=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          VC=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          TV=$(grep -oP '"version"\s*:\s*"\K[^"]+' bureau/src-tauri/tauri.conf.json)

          if [ -z "$V" ] || [ "$VC" != "$V" ]; then
            echo "::error::Version Android incohérente : versionCode=$VC, versionName=$V."
            exit 1
          fi
          if [ "$TV" != "$V.0.0" ]; then
            echo "::error::Version Windows incohérente : $TV au lieu de $V.0.0."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$V."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Une publication manuelle doit être lancée depuis main, pas $GITHUB_REF_NAME."
            exit 1
          fi

          MANQUANTS=""
          [ -n "$CLE" ] || MANQUANTS="$MANQUANTS KEYSTORE_BASE64"
          [ -n "$MDP_MAGASIN" ] || MANQUANTS="$MANQUANTS KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || MANQUANTS="$MANQUANTS KEY_ALIAS"
          [ -n "$MDP_CLE" ] || MANQUANTS="$MANQUANTS KEY_PASSWORD"
          if [ -n "$MANQUANTS" ]; then
            echo "::error::Publication refusée : secret(s) absent(s) :$MANQUANTS"
            echo "::error::Le workflow ne fabriquera jamais une Release signée avec la clé de debug."
            exit 1
          fi

          if ! printf '%s' "$CLE" | base64 -d > "$RUNNER_TEMP/cle.jks"; then
            echo "::error::KEYSTORE_BASE64 n'est pas un magasin de clés Base64 valide."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/cle.jks" ]; then
            echo "::error::Le magasin de clés restauré est vide."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cle.jks" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version v$V cohérente ; secrets de signature présents."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::La clé de publication est illisible, le mot de passe est faux ou l'alias n'existe pas."
            exit 1
          fi
          echo "Clé de publication vérifiée avant les tests."

      # Contrôles automatiques AVANT tout le reste (v134) : une faute détectée ici
      # coûte une minute au lieu de toute la compilation. Détail : outils/controles.sh
      # v178 : les tests MIDI natifs utilisent seulement la bibliothèque Rust standard.
      - uses: dtolnay/rust-toolchain@stable

      - name: Contrôles automatiques
        run: bash outils/controles.sh

      # v301 : la publication passe désormais la même batterie navigateur que
      # l'APK ordinaire. Une Release ne peut donc plus être moins testée qu'un push.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test dans un navigateur
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium > /dev/null
          python outils/test-navigateur.py
          python outils/test-export-midi.py
          python outils/test-graphique.py
          python outils/test-facades.py
          python outils/test-eurorack-focus.py
          python outils/test-menu-machines.py
          python outils/test-outils-studio.py
          python outils/test-retours-musicaux.py
          python outils/test-gestes-musicaux.py
          python outils/test-automations-machines.py
          python outils/test-ecrans-performance.py
          python outils/test-onde-smpltrek.py
          python outils/test-retours-frappe.py --rapport app/build/reports/retours-frappe.json
          python outils/test-reperes-kaoss.py --rapport app/build/reports/reperes-kaoss.json
          python outils/test-focus-mixage.py --rapport app/build/reports/focus-mixage.json
          python outils/test-editeur-sons.py --rapport app/build/reports/editeur-sons.json
          python outils/test-vue-ensemble.py --rapport app/build/reports/vue-ensemble.json
          python outils/test-ensembles-eurorack.py --rapport app/build/reports/ensembles-eurorack.json
          python outils/test-drum32.py --rapport app/build/reports/drum32.json
          python outils/test-melo32.py --rapport app/build/reports/melo32.json
          python outils/test-scenes8.py --rapport app/build/reports/scenes8.json
          python outils/test-rave.py --rapport app/build/reports/rave.json
          python outils/test-break32-bibliotheque.py --rapport app/build/reports/break32-bibliotheque.json
          python outils/test-performance-eurorack.py --rapport app/build/reports/performance-eurorack.json
          python outils/test-variations-rythmiques.py --rapport app/build/reports/variations-rythmiques.json
          python outils/test-atelier-kick-basse.py --rapport app/build/reports/atelier-kick-basse.json
          python outils/test-harmonie8.py --rapport app/build/reports/harmonie8.json
          python outils/test-stutter-live.py --rapport app/build/reports/stutter-live.json
          python outils/test-couleurs-eurorack.py --rapport app/build/reports/couleurs-eurorack.json
          python outils/test-freeze-granulaire.py --rapport app/build/reports/freeze-granulaire.json
          python outils/test-cycles-libres.py --rapport app/build/reports/cycles-libres.json
          python outils/test-voix-mutantes.py --rapport app/build/reports/voix-mutantes.json
          python outils/test-poly4.py --rapport app/build/reports/poly4.json
          python outils/test-looper.py --rapport app/build/reports/looper.json
          python outils/test-dialogue.py --rapport app/build/reports/dialogue.json
          python outils/test-accordages.py --rapport app/build/reports/accordages.json
          python outils/test-cc0-github.py --rapport app/build/reports/cc0-github.json

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      # Le transfert vers une vraie volca a besoin du Syro de Korg, compilé en
      # WebAssembly. Emscripten est installé à la main plutôt que par une action
      # tierce : une dépendance de moins, et le journal dit exactement où ça
      # casse. En « continue-on-error » : si quoi que ce soit manque, l'APK se
      # construit quand même et l'application annonce simplement que le
      # transfert n'est pas disponible.
      - name: Compiler le Syro en WebAssembly
        continue-on-error: true
        run: |
          set -e
          source outils/installer-emscripten.sh
          bash syro/construire.sh

      # continue-on-error rend l'échec presque invisible : une coche verte avec
      # un point d'exclamation qu'on ne remarque pas. On écrit donc noir sur
      # blanc, en tête du rapport, si le transfert est dans cet APK ou non.
      - name: État du transfert volca
        if: always()
        run: |
          if [ -f app/src/main/assets/syro/syro.js ]; then
            T=$(du -h app/src/main/assets/syro/syro.js | cut -f1)
            echo "**Transfert volca : disponible** dans cet APK ($T)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Transfert volca : absent** de cet APK — voir l'étape « Compiler le Syro »." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compiler l'APK de publication
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      # Deuxième ceinture v301 : la signature est contrôlée sur l'APK réellement
      # produit, et une identité « Android Debug » fait échouer la publication.
      - name: Vérifier la signature de l'APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)
          if [ -z "$APK" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Impossible de contrôler la signature de l'APK."
            exit 1
          fi
          mkdir -p app/build/reports
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app/build/reports/signature-publication.txt
          if grep -qi 'Android Debug' app/build/reports/signature-publication.txt; then
            echo "::error::APK de publication signé avec une identité de debug : publication refusée."
            exit 1
          fi

      - name: Relever la version et nommer le fichier
        id: version
        run: |
          V="$VERSION"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p publication
          # Deux noms : l'un daté pour l'archive, l'autre FIXE pour que le lien
          # de la page de téléchargement ne change jamais.
          cp app/build/outputs/apk/release/*.apk "publication/drm16-v$V.apk"
          cp app/build/outputs/apk/release/*.apk "publication/drm16.apk"
          # Tous les assets des modules invites, avec le Syro s'il est disponible.
          python3 outils/paquet-pc.py publication/drm16-pc.zip
          # Compatibilite avec l'ancien lien : le HTML seul reste disponible.
          cp app/src/main/assets/drm16.html "publication/drm16.html"
          ls -lh publication/

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.v }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ETIQ="v$V"
          else
            ETIQ="$GITHUB_REF_NAME"
          fi
          cat > notes.md <<FIN
          **Boîtes à rythmes autonomes — version $V**

          Boîtes à rythmes, échantillonneurs et rack Eurorack, hors ligne, sans compte.

          ### Sur Android
          1. Téléchargez \`drm16-v$V.apk\` ci-dessous.
          2. Android demandera d'autoriser l'installation depuis cette source : c'est normal pour une
             application distribuée hors du Play Store.
          3. Si une version précédente est installée, celle-ci se met par-dessus sans perdre vos motifs.

          Android 7 minimum. Aucune permission réseau n'est requise pour jouer.

          ### Sur ordinateur
          **Windows** : \`DRM16-installeur.exe\`, ajouté à cette version quelques minutes après l'APK.

          **Sans installation** : téléchargez \`drm16-pc.zip\`, décompressez tout le dossier,
          puis ouvrez \`drm16.html\`. Studio, Nexus et leurs sons sont inclus ; la notice du ZIP
          explique le lancement local si votre navigateur bloque leurs sons depuis le disque.
          L'ancien téléchargement \`drm16.html\` reste proposé, mais ne contient pas ces modules.

          L'**installeur Windows** offre le MIDI externe et la bibliothèque native de fichiers.
          La **version navigateur** n'a pas ces fonctions natives ni les téléchargements archive.org ;
          son export WAV passe par les téléchargements du navigateur. La conservation des motifs
          dépend de la mémoire locale autorisée par le navigateur et de l'adresse utilisée.
          FIN
          gh release create "$ETIQ" \
            --title "Version $V" \
            --notes-file notes.md \
            publication/drm16-v$V.apk publication/drm16.apk publication/drm16.html publication/drm16-pc.zip

      # La page de la version Windows est préparée ICI, sous Linux, où le Syro
      # vient d'être compilé : le poste Windows n'a plus qu'à la reprendre (v136).
      - name: Préparer bureau/dist
        run: bash bureau/preparer.sh

      - uses: actions/upload-artifact@v7
        with:
          name: bureau-prepare
          path: |
            bureau/dist/
            bureau/src-tauri/tauri.conf.json
            bureau/src-tauri/Cargo.toml
          if-no-files-found: error
          retention-days: 3

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-publication
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # Ce poste attend que la version existe : il ne fait qu'y joindre l'exécutable.
    needs: publier
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # La compilation Rust est longue la première fois, quelques minutes ensuite.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bureau/src-tauri

      - uses: actions/download-artifact@v8
        with:
          name: bureau-prepare
          path: bureau

      - name: Vérifier la page reçue
        shell: pwsh
        run: |
          foreach ($f in "bureau/dist/index.html", "bureau/dist/studio/index.html", "bureau/dist/nexus/index.html") {
            if (-not (Test-Path $f)) { throw "Absent : $f" }
          }
          if (Test-Path "bureau/dist/syro/syro.js") { Write-Host "Transfert volca : présent." }
          else { Write-Host "::warning::Transfert volca absent de cet exécutable." }

      - name: Tester les commandes MIDI natives
        run: python outils/test-midi-bureau.py

      - name: Installer l'outil Tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Compiler l'exécutable
        working-directory: bureau/src-tauri
        run: cargo tauri build

      # Essai de la vraie application (v139) : la page se teste elle-même dans
      # WebView2, contre la coque Rust, puis l'application quitte avec 0 ou 1.
      # Bloquant depuis la v140 : vu fonctionner sur l'exécuteur Windows en v139.
      - name: Essai automatique de l'application
        shell: pwsh
        run: |
          $exe = Get-ChildItem bureau/src-tauri/target/release -Filter *.exe |
                 Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $exe) { throw "Exécutable introuvable." }
          $env:DRM16_AUTOTEST = Join-Path $PWD "autotest.txt"
          $env:DRM16_DOSSIER = Join-Path $PWD "autotest-dossier"
          $p = Start-Process $exe.FullName -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'application n'a pas rendu son rapport en deux minutes." }
          if (Test-Path autotest.txt) { Get-Content autotest.txt } else { Write-Host "Aucun rapport écrit." }
          if (Test-Path autotest.txt) {
            "### Essai automatique (Windows)" >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            Get-Content autotest.txt >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          if ($p.ExitCode -ne 0) { throw "Essai en échec (code $($p.ExitCode))." }

      - name: Joindre l'exécutable à la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*-setup.exe" bureau/src-tauri/target/release/bundle |
                 Select-Object -First 1
          if (-not $exe) { throw "Aucun installeur produit." }
          Copy-Item $exe.FullName "DRM16-installeur.exe"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = (Select-String -Path app/build.gradle -Pattern "versionName\s+'([^']+)'").Matches[0].Groups[1].Value
            $etiq = "v$v"
          } else {
            $etiq = "${{ github.ref_name }}"
          }
          gh release upload $etiq "DRM16-installeur.exe" --clobber

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-windows
          path: bureau/src-tauri/target/release/build/**/output
          if-no-files-found: ignore
          retention-days: 7
