name: Exécutable Windows
run-name: "Windows · ${{ github.event.head_commit.message || github.ref_name }}"

# v277 : un installateur à chaque mise à jour envoyée sur main, comme l'APK.
# Le lancement à la demande reste disponible dans l'onglet Actions.
# Aucun filtre de fichiers : une modification d'interface, de sons ou de code
# doit toujours pouvoir produire son exécutable Windows.
#
# Deux postes (v136) : Linux prépare la page (contrôles, Syro, bureau/dist),
# Windows ne fait que compiler. Le Syro ne se compile que sous Linux : c'est ce
# partage qui le met enfin dans l'exécutable.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Une nouvelle version n'annule pas la compilation Windows de la précédente.
# Seuls deux lancements du même commit sur la même référence se remplacent.
# Le préfixe windows- reste distinct de celui du workflow APK.
concurrency:
  group: windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v178 : les tests MIDI natifs utilisent seulement la bibliothèque Rust standard.
      - uses: dtolnay/rust-toolchain@stable

      - name: Contrôles automatiques
        run: bash outils/controles.sh

      - name: Compiler le Syro en WebAssembly
        continue-on-error: true
        run: |
          set -e
          source outils/installer-emscripten.sh
          bash syro/construire.sh

      - name: Préparer bureau/dist
        run: bash bureau/preparer.sh

      # Le dossier de la page ET les deux fichiers dont la version vient d'être
      # mise à jour : téléchargés sous bureau/, ils retrouvent leur place.
      - uses: actions/upload-artifact@v7
        with:
          name: bureau-prepare
          path: |
            bureau/dist/
            bureau/src-tauri/tauri.conf.json
            bureau/src-tauri/Cargo.toml
          if-no-files-found: error
          retention-days: 3

  exe:
    needs: preparer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bureau-prepare
          path: bureau

      - name: Vérifier la page reçue
        shell: pwsh
        run: |
          foreach ($f in "bureau/dist/index.html", "bureau/dist/studio/index.html", "bureau/dist/nexus/index.html") {
            if (-not (Test-Path $f)) { throw "Absent : $f" }
          }
          if (Test-Path "bureau/dist/syro/syro.js") { Write-Host "Transfert volca : présent." }
          else { Write-Host "::warning::Transfert volca absent de cet exécutable." }
          Select-String -Path bureau/src-tauri/tauri.conf.json -Pattern '"version"'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bureau/src-tauri

      - name: Tester les commandes MIDI natives
        run: python outils/test-midi-bureau.py

      - name: Installer l'outil Tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Compiler l'exécutable
        working-directory: bureau/src-tauri
        run: cargo tauri build

      # Essai de la vraie application (v139) : la page se teste elle-même dans
      # WebView2, contre la coque Rust, puis l'application quitte avec 0 ou 1.
      # Bloquant depuis la v140 : vu fonctionner sur l'exécuteur Windows en v139.
      - name: Essai automatique de l'application
        shell: pwsh
        run: ./outils/essai-windows.ps1

      - name: Joindre le rapport de l'essai Windows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-autotest-windows
          path: |
            autotest.txt
            autotest-lancement.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Récupérer l'installeur
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*-setup.exe" bureau/src-tauri/target/release/bundle |
                 Select-Object -First 1
          if (-not $exe) { throw "Aucun installeur produit." }
          New-Item -ItemType Directory -Force -Path sortie | Out-Null
          Copy-Item $exe.FullName sortie/DRM16-installeur.exe

      - uses: actions/upload-artifact@v7
        with:
          name: drm16-windows
          path: sortie/DRM16-installeur.exe
          if-no-files-found: error

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-windows
          path: bureau/src-tauri/target/release/build/**/output
          if-no-files-found: ignore
          retention-days: 7
