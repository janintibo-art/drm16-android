<div class="stkb" id="unit-stk">
  <div class="stk-haut">
    <div class="stk-marque">SONICWARE</div>
    <b class="stk-nom" id="stk-notice">SmplTrek</b>
    <div class="stk-prises"><span>IN</span><span>SYNC</span><span>OUT</span></div>
  </div>

  <div class="stk-mid">
    <canvas id="stk-ecran" width="340" height="150"></canvas>
    <div class="stk-kns">
      <div class="stk-kn" id="stk-k-tune"><div class="bt"><i></i></div><em>A · TUNE</em></div>
      <div class="stk-kn" id="stk-k-dec"><div class="bt"><i></i></div><em>B · DECAY</em></div>
      <div class="stk-kn" id="stk-k-filt"><div class="bt"><i></i></div><em>C · FILTER</em></div>
      <div class="stk-kn" id="stk-k-niv"><div class="bt"><i></i></div><em>D · LEVEL</em></div>
      <div class="stk-kn" id="stk-k-pan"><div class="bt"><i></i></div><em>PAN</em></div>
    </div>
  </div>

  <div class="stk-cmd">
    <button id="stk-play">▶ PLAY</button>
    <button id="stk-ptn">MOTIF 1</button>
    <button id="stk-son">SON</button>
    <button id="stk-solo">SOLO</button>
    <button id="stk-clear">EFFACER</button>
  </div>

  <div class="stk-cmd">
    <button id="stk-import">CHOISIR SON</button>
    <button id="stk-slice" aria-pressed="false">SLICE : NON</button>
    <output id="stk-source" aria-live="polite"></output>
  </div>
  <div class="stk-instrument-commandes">
    <button id="stk-instrument" aria-pressed="false">TYPE : SHOTS</button>
    <select id="stk-note" aria-label="Hauteur relative au sample en demi-tons"></select>
    <button id="stk-ecouter">ÉCOUTER</button>
  </div>
  <div class="stk-midi-commandes">
    <button id="stk-midi" aria-pressed="false">MIDI : PISTES</button>
    <output id="stk-midi-info" aria-live="polite"></output>
  </div>
  <div id="stk-tranches" role="group" aria-label="Huit tranches égales du son" hidden></div>
  <div class="stk-motifs-commandes">
    <button id="stk-quantifie" aria-pressed="false">DIRECT</button>
    <button id="stk-annuler" disabled>ANNULER</button>
    <output id="stk-lancement-etat" aria-live="polite">CHANGEMENT EN DIRECT</output>
    <button id="stk-copier">COPIER MOTIF</button>
    <button id="stk-coller" disabled>COLLER MOTIF</button>
    <output id="stk-copie-etat" aria-live="polite">AUCUNE COPIE</output>
  </div>
  <div class="stk-chaine-commandes">
    <button id="stk-chaine" aria-pressed="false">CHAÎNE : NON</button>
    <button id="stk-chaine-ajout">+ MOTIF 1</button>
    <button id="stk-chaine-retirer" disabled>RETIRER FIN</button>
    <button id="stk-chaine-vider" disabled>VIDER</button>
  </div>
  <div id="stk-chaine-liste" tabindex="0" aria-label="Ordre des motifs de la chaîne"></div>
  <div id="stk-chaine-edition" hidden>
    <output id="stk-chaine-selection" aria-live="polite"></output>
    <div class="stk-chaine-commandes">
      <button id="stk-chaine-gauche" aria-label="Déplacer l'entrée vers le début">← AVANT</button>
      <button id="stk-chaine-droite" aria-label="Déplacer l'entrée vers la fin">APRÈS →</button>
      <button id="stk-chaine-dupliquer">DUPLIQUER</button>
      <button id="stk-chaine-supprimer">RETIRER</button>
    </div>
  </div>
  <output id="stk-chaine-etat" aria-live="polite"></output>
  <button id="stk-export-chaine">CHAÎNE EN WAV · UN PASSAGE</button>
  <output id="stk-export-chemin" aria-live="polite"></output>
  <div class="stk-pads" id="stk-pads"></div>
  <div class="stk-trks" id="stk-trks"></div>
  <div class="stk-pied"><span id="stk-etat">Choisissez une piste, puis écrivez ses pas.</span></div>
</div>
