<div class="kob" id="unit-ko">
  <div class="ko-haut">
    <div class="ko-poignee"></div>
    <div class="ko-marque">pocket operator</div>
  </div>
  <div class="ko-tete">
    <b class="ko-nom" id="ko-notice">K.O!</b>
    <div class="ko-lcd">
      <u id="ko-lab">SAMPLE</u>
      <b id="ko-val">1</b>
      <i id="ko-bpm">120</i>
    </div>
  </div>

  <div class="ko-cmd">
    <button id="ko-son">SOUND</button>
    <button id="ko-ptn">PATTERN</button>
    <button id="ko-bpm-b">BPM</button>
    <button id="ko-rec">RECORD</button>
  </div>

  <div class="ko-pads" id="ko-pads"></div>

  <div class="ko-lock" id="ko-lock">
    <div class="ko-lock-titre"><b>PARAMETER LOCK</b><span id="ko-lock-status">PAS 1 · AUCUN</span></div>
    <div class="ko-lock-ligne">
      <label for="ko-lock-param">PARAMÈTRE</label>
      <select id="ko-lock-param" aria-label="Paramètre verrouillé"><option value="pitch">PITCH</option><option value="start">START</option><option value="length">LENGTH</option><option value="tone">TONE</option></select>
      <label for="ko-lock-step">PAS</label>
      <select id="ko-lock-step" aria-label="Pas du Parameter Lock"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option><option value="5">6</option><option value="6">7</option><option value="7">8</option><option value="8">9</option><option value="9">10</option><option value="10">11</option><option value="11">12</option><option value="12">13</option><option value="13">14</option><option value="14">15</option><option value="15">16</option></select>
    </div>
    <div class="ko-lock-ligne ko-lock-valeur">
      <input id="ko-lock-value" type="range" min="0" max="127" value="64" aria-label="Valeur du Parameter Lock">
      <output id="ko-lock-value-label" for="ko-lock-value">0 st</output>
      <button id="ko-lock-apply" type="button">ÉCRIRE</button>
      <button id="ko-lock-clear" type="button">EFFACER</button>
    </div>
  </div>

  <div class="ko-bas">
    <button id="ko-fx">FX</button>
    <button id="ko-play">PLAY</button>
    <button id="ko-write">WRITE</button>
  </div>
  <div class="ko-pied">
    <span id="ko-etat">Touchez un pad pour l'entendre · WRITE pour écrire dans le motif</span>
  </div>
</div>
