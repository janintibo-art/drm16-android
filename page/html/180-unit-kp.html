<div class="kpb" id="unit-kp">
  <div class="kp-haut">
    <b class="kp-marque">KORG</b>
    <span class="kp-sous">DYNAMIC EFFECT / SAMPLER</span>
    <b class="kp-nom" id="kp-notice">KAOSS PAD</b>
  </div>

  <div class="kp-reglages">
    <div class="kp-banques" id="kp-banques"></div>
    <div class="kp-ligne kp-bib-l">
      <button id="kp-bib">BIBLIO</button>
      <output id="kp-son-nom" aria-label="Son de la banque choisie"></output>
    </div>
    <div class="kp-ligne">
      <button id="kp-selection" title="Choisir une banque sans jouer">BANQUE A</button>
      <button id="kp-mode" title="Changer le mode de la banque choisie">LOOP</button>
      <button id="kp-stop-banque">STOP A</button>
      <button id="kp-stop-tout">STOP TOUT</button>
    </div>
    <div class="kp-ligne kp-slice-l">
      <button id="kp-slice" aria-pressed="false">SLICE : NON</button>
      <output id="kp-tranche-etat">BANQUE A · SON ENTIER</output>
    </div>
    <div class="kp-tranches" id="kp-tranches" role="group" aria-label="Tranches de la banque A" hidden></div>
    <div class="kp-ligne">
      <button id="kp-son">SON</button>
      <button id="kp-fx">EFFET</button>
      <button id="kp-hold">HOLD</button>
      <button id="kp-mute">MUTE</button>
    </div>
    <div class="kp-ligne">
      <button id="kp-motion">PAD MOTION</button>
      <button id="kp-rejoue">REJOUER</button>
      <button id="kp-effacer">EFFACER</button>
      <button id="kp-play">▶ PLAY</button>
    </div>
    <div class="kp-ligne kp-prof-l">
      <label>FX DEPTH</label>
      <input type="range" id="kp-prof" min="0" max="1" step="0.01" value="0.8">
      <div class="kp-lcd"><b id="kp-val">PASSE-BAS RÉSONANT</b><u id="kp-lab">X · Y</u></div>
    </div>
    <div class="kp-ligne kp-tempo-l">
      <button id="kp-tap">TAP BPM</button>
      <button id="kp-tempo-moins" aria-label="Diminuer le tempo de 1 BPM">− BPM</button>
      <output id="kp-tempo" aria-label="Tempo commun">120 BPM</output>
      <button id="kp-tempo-plus" aria-label="Augmenter le tempo de 1 BPM">+ BPM</button>
    </div>
  </div>

  <div class="kp-pav" id="kp-pav"><i id="kp-point"></i><u id="kp-trace"></u></div>
  <div class="kp-pied"><span id="kp-etat">Allumez une banque, puis touchez le pavé.</span></div>
</div>
