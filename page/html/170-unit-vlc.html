<div class="korgv" id="unit-vlc">

  <div class="em-jacks">
    <div class="grp"><div class="tr"><i></i></div><span>PHONES</span></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>SYNC IN / OUT</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i></div><span>MIDI IN</span></div>
  </div>

  <div class="vlc-tete">
    <div class="vlc-korg">KORG</div>
    <div class="vlc-lcd"><b id="vlc-val">P1</b><u id="vlc-lab">PART</u></div>
    <div class="vlc-nom" id="vlc-notice">volca <span>sample</span></div>
  </div>

  <div class="vlc-kns" id="vlc-kns"></div>

  <div class="vlc-parts" id="vlc-parts"></div>

  <div class="vlc-fx">
    <button class="vlcb" id="vlc-play">PLAY</button>
    <button class="vlcb" id="vlc-rec">● REC PAS</button>
    <button class="vlcb" id="vlc-motion">MOTION</button>
    <button class="vlcb" id="vlc-loop">LOOP</button>
    <button class="vlcb" id="vlc-reverb">REVERB</button>
    <button class="vlcb" id="vlc-reverse">REVERSE</button>
    <button class="vlcb" id="vlc-mute">MUTE</button>
    <button class="vlcb" id="vlc-son">SAMPLE</button>
    <button class="vlcb" id="vlc-motif">PTN 1</button>
    <button class="vlcb" id="vlc-export">EXPORT .dat</button>
    <button class="vlcb" id="vlc-import">IMPORT .dat</button>
  </div>

  <div class="vlc-pas" id="vlc-pas"></div>
</div>
