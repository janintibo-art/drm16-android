<div class="rtr" id="unit-tr808">

  <div class="em-jacks">
    <div class="grp"><div class="tr"><i></i></div><span>PHONES</span></div>
    <div class="grp"><div class="tr"><i></i></div><span>MIX OUT</span></div>
    <div class="grp"><div class="tr"><i></i><i></i><i></i></div><span>BD&nbsp;&nbsp;SD&nbsp;&nbsp;LT · INDIV</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>SYNC IN / OUT</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i></div><span>DC 9V</span></div>
  </div>

  <div class="tr8-tete">
    <div class="tr8-roland">Roland</div>
    <div class="tr8-nom"><b id="tr8-notice">TR-808</b><span id="tr8-sstitre">RHYTHM COMPOSER</span></div>
  </div>

  <div class="tr8-instr" id="tr8-instr"></div>

  <div class="tr8-bar">
    <button class="tr8b" id="tr8-start" style="padding:12px 18px">START</button>
    <button class="tr8b" id="tr8-stop" style="padding:12px 18px">STOP/CONT</button>
    <div class="tr8-lcd"><b id="tr8-val">01</b><u id="tr8-lab">PATTERN</u></div>
    <div class="tr8-kn" style="width:44px" id="tr8-k-tempo"><div class="bt" style="width:44px;height:44px"><i></i></div><em>TEMPO</em></div>
    <div class="tr8-kn" style="width:44px" id="tr8-k-vol"><div class="bt" style="width:44px;height:44px"><i></i></div><em>VOLUME</em></div>
    <button class="tr8b" id="tr8-var">VARIATION A</button>
    <button class="tr8b" id="tr8-mode">PATTERN WRITE</button>
    <button class="tr8b" id="tr8-clear">CLEAR</button>
    <button class="tr8b" id="tr8-scale">SCALE 16</button>
    <button class="tr8b" id="tr8-last">LAST STEP 16</button>
    <button class="tr8b" id="tr8-dist" style="display:none">DIST OFF</button>
    <button class="tr8b" id="tr8-clap" style="display:none">CY / CP</button>
    <button class="tr8b" id="tr8-couleur" style="display:none">COULEUR</button>
    <div class="tr8-kn" id="tr8-kn-tone" style="width:44px;display:none">
      <div class="bt" id="tr8-k-tone" style="width:44px;height:44px"><i></i></div><em>TONE</em></div>
    <div class="tr8-kn" id="tr8-kn-drive" style="width:44px;display:none">
      <div class="bt" id="tr8-k-drive" style="width:44px;height:44px"><i></i></div><em>DRIVE</em></div>
    <button class="tr8b" id="tr8-shuffle">SHUFFLE 0%</button>
    <button class="tr8b" id="tr8-fill">FILL 16</button>
    <button class="tr8b" id="tr8-autofill">AUTO FILL OFF</button>
    <button class="tr8b" id="tr8-track">TRACK</button>
    <button class="tr8b" id="tr8-flam" style="display:none">FLAM OFF</button>
    <button class="tr8b" id="tr8-tap">TAP</button>
  </div>

  <div class="tr8-sel" id="tr8-sel"></div>

  <div class="tr8-matrice" id="tr8-matrice" style="display:none"></div>
  <div class="tr8-pas" id="tr8-pas"></div>
  <div class="tr8-nums" id="tr8-nums"></div>
</div>
