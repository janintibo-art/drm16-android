<div class="t1kb" id="unit-t1k">

  <div class="em-jacks">
    <div class="grp"><div class="tr"><i></i></div><span>PHONES</span></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>MIX OUT L / R</span></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>EXT IN</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>TRIGGER OUT</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>MIDI IN / OUT</span></div>
  </div>

  <div class="t1k-tete">
    <div class="t1k-nom" id="t1k-notice">TR-1000<small>RHYTHM CREATOR · ANALOG + PCM</small></div>
    <div class="t1k-lcd"><b id="t1k-val">BASS DRUM</b><u id="t1k-lab">PTN A1 · ANALOG</u></div>
  </div>

  <div class="t1k-bar">
    <button id="t1k-start" style="padding:12px 16px">START</button>
    <button id="t1k-rec">● REC</button>
    <button id="t1k-stop" style="padding:12px 16px">STOP</button>
    <button id="t1k-fill">FILL IN TRIG</button>
    <button id="t1k-sub">SUB STEP</button>
    <button id="t1k-accent">ACCENT</button>
    <button id="t1k-last">LAST 16</button>
    <select id="t1k-banque" aria-label="Banque de motifs TR-1000"></select>
    <button id="t1k-ptn">PTN A1</button>
    <button id="t1k-ech">SAMPLE B</button>
    <button id="t1k-afx">ANALOG FX</button>
    <button id="t1k-ma">SET A</button>
    <button id="t1k-mb">SET B</button>
    <div class="t1k-morph" id="t1k-morph"><b></b></div>
    <span style="font:700 7px/1 'Roboto Condensed',Arial;letter-spacing:1.4px;color:#4a4d53">MORPH</span>
  </div>

  <div class="t1k-bar">
    <div class="t1k-kn" style="width:38px" id="t1k-k-filt"><div class="bt">><i></i></div><em>A.FILTER</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-drive"><div class="bt">><i></i></div><em>A.DRIVE</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-rev"><div class="bt">><i></i></div><em>REVERB</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-dly"><div class="bt">><i></i></div><em>DELAY</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-fb"><div class="bt">><i></i></div><em>FEEDBACK</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-vol"><div class="bt">><i></i></div><em>VOLUME</em></div>
    <div class="t1k-kn" style="width:38px" id="t1k-k-tempo"><div class="bt">><i></i></div><em>TEMPO</em></div>
  </div>

  <div class="t1k-instr" id="t1k-instr"></div>
  <div class="t1k-proba-bar">
    <label for="t1k-direction">SENS</label>
    <select id="t1k-direction" aria-label="Sens de lecture de l'instrument sélectionné">
      <option value="avant">AVANT</option><option value="arriere">ARRIÈRE</option><option value="pingpong">ALLER-RETOUR</option>
    </select>
    <button id="t1k-proba" aria-pressed="false">PROBABILITÉ</button>
    <select id="t1k-proba-valeur" aria-label="Probabilité à appliquer aux pas" disabled></select>
    <button id="t1k-cycle" aria-pressed="false">CYCLE</button>
    <select id="t1k-cycle-valeur" aria-label="Cycle à appliquer aux pas" disabled><option value="1:1">TOUS</option><option value="1:2">1:2</option><option value="2:2">2:2</option><option value="1:3">1:3</option><option value="2:3">2:3</option><option value="3:3">3:3</option><option value="1:4">1:4</option><option value="2:4">2:4</option><option value="3:4">3:4</option><option value="4:4">4:4</option></select>
    <button id="t1k-decalage" aria-pressed="false">RETARD</button>
    <select id="t1k-retard-valeur" aria-label="Retard à appliquer, en fraction de pas" disabled><option value="0">0</option><option value="1">+1/16</option><option value="2">+2/16</option><option value="4">+4/16</option><option value="8">+8/16</option></select>
    <output id="t1k-proba-aide" aria-live="polite"></output>
  </div>
  <div class="t1k-pas" id="t1k-pas"></div>
</div>
