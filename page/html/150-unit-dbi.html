<div class="dbib" id="unit-dbi">

  <div class="em-jacks">
    <div class="grp"><div class="tr"><i></i></div><span>PHONES</span></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>MIX / KICK OUT</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>SYNC IN / OUT</span></div>
    <div class="fill"></div>
    <div class="grp"><div class="tr"><i></i><i></i></div><span>MIDI IN / OUT</span></div>
  </div>

  <div class="dbi-tete">
    <div class="dbi-nom" id="dbi-notice">DRUMBRUTE IMPACT<small>ANALOG DRUM SYNTHESIZER</small></div>
    <div class="dbi-lcd"><b id="dbi-val">PTN 1</b><u id="dbi-lab">PATTERN</u></div>
    <div class="dbi-trans">
      <button id="dbi-rec">● REC</button>
      <button id="dbi-stop">■ STOP</button>
      <button id="dbi-play">▶ PLAY</button>
      <button id="dbi-color" class="bleu">COLOR</button>
      <button id="dbi-poly">POLYRHYTHM</button>
      <button id="dbi-roller">ROLLER</button>
    </div>
  </div>

  <div class="dbi-voix" id="dbi-voix"></div>

  <div class="dbi-bar">
    <div class="dbi-kn" style="width:44px" id="dbi-k-swing"><div class="bt">><i></i></div><em>SWING</em></div>
    <div class="dbi-kn" style="width:44px" id="dbi-k-random"><div class="bt">><i></i></div><em>RANDOM</em></div>
    <div class="dbi-kn" style="width:44px" id="dbi-k-drive"><div class="bt">><i></i></div><em>DISTORTION</em></div>
    <div class="dbi-kn" style="width:44px" id="dbi-k-vol"><div class="bt">><i></i></div><em>MASTER</em></div>
    <div class="dbi-kn" style="width:44px" id="dbi-k-tempo"><div class="bt">><i></i></div><em>RATE</em></div>
    <button id="dbi-dist">DIST ON</button>
    <button id="dbi-accent">ACCNT</button>
    <button id="dbi-color-steps" aria-pressed="false">COLOR STEP</button>
    <button id="dbi-repeat" aria-pressed="false">STEP REPEAT</button>
    <button id="dbi-last">LAST STEP 16</button>
    <button id="dbi-len">TRACK LEN 16</button>
    <button id="dbi-copy">COPY</button>
    <button id="dbi-erase">ERASE</button>
    <button id="dbi-ptn">PTN 1</button>
  </div>

  <div class="dbi-bar dbi-looper" aria-label="Pattern Looper : maintenir pour répéter">
    <span>MAINTENIR</span>
    <button id="dbi-loop-1" aria-pressed="false">LOOP 1</button>
    <button id="dbi-loop-2" aria-pressed="false">LOOP 2</button>
    <button id="dbi-loop-4" aria-pressed="false">LOOP 4</button>
    <button id="dbi-loop-8" aria-pressed="false">LOOP 8</button>
  </div>
  <div class="dbi-bar" aria-label="Groupes de pas">
    <button id="dbi-page-0" aria-pressed="true">1–16</button>
    <button id="dbi-page-1" aria-pressed="false">17–32</button>
    <button id="dbi-page-2" aria-pressed="false">33–48</button>
    <button id="dbi-page-3" aria-pressed="false">49–64</button>
  </div>
  <div class="dbi-pas" id="dbi-pas"></div>
</div>
