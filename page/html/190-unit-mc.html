<div class="mcb" id="unit-mc">
  <div class="mc-haut">
    <b class="mc-marque">Roland</b>
    <span class="mc-gb">GROOVEBOX</span>
    <b class="mc-nom" id="mc-notice">MC-101</b>
  </div>

  <div class="mc-tete">
    <div class="mc-lcd"><u id="mc-lab">PISTE</u><b id="mc-val">1</b></div>
    <button id="mc-scat">SCATTER</button>
  </div>

  <div class="mc-scatline">
    <span id="mc-scat-nom">répétition</span>
    <input type="range" id="mc-scat-prof" min="0" max="1" step="0.02" value="0.5">
    <button id="mc-scat-type">TYPE</button>
  </div>

  <div class="mc-trks" id="mc-trks"></div>

  <div class="mc-clips" id="mc-clips" role="group" aria-label="Clips de la piste choisie"></div>
  <div class="mc-scenes" id="mc-scenes" role="group" aria-label="Scènes : combinaisons de clips sur les quatre pistes"></div>
  <div class="mc-scenes-memoire">
    <button id="mc-memoriser-scene" aria-pressed="false">MÉMORISER</button>
    <button id="mc-retablir-scenes" title="Rétablir les quatre scènes d'origine" disabled>RÉTABLIR</button>
    <output id="mc-scenes-etat" aria-live="polite">CLIPS DES PISTES 1 · 2 · 3 · 4</output>
  </div>
  <div class="mc-lancement">
    <button id="mc-quantifie" aria-label="Lancement à la mesure" aria-pressed="false">DIRECT</button>
    <button id="mc-annuler" disabled>ANNULER</button>
    <output id="mc-lancement-etat" aria-live="polite">CLIPS ET SCÈNES EN DIRECT</output>
  </div>
  <div class="mc-copie">
    <button id="mc-copier">COPIER</button>
    <button id="mc-coller" disabled>COLLER</button>
    <output id="mc-copie-etat" aria-live="polite">AUCUNE COPIE</output>
  </div>

  <div class="mc-kns">
    <div class="mc-kn" id="mc-k-cut"><div class="bt"><i></i></div><em>C1 · FILTRE</em></div>
    <div class="mc-kn" id="mc-k-dec"><div class="bt"><i></i></div><em>C2 · DÉCLIN</em></div>
    <div class="mc-kn" id="mc-k-niv"><div class="bt"><i></i></div><em>C3 · NIVEAU</em></div>
    <div class="mc-kn" id="mc-k-note"><div class="bt"><i></i></div><em>C4 · NOTE</em></div>
  </div>

  <div class="mc-pads" id="mc-pads"></div>

  <div class="mc-cmd">
    <button id="mc-play">▶ PLAY</button>
    <button id="mc-clip">CLIP 1</button>
    <button id="mc-onde">ONDE</button>
    <button id="mc-clear">EFFACER</button>
  </div>
  <div class="mc-pied"><span id="mc-etat">Les pads écrivent les pas de la piste choisie.</span></div>
</div>
