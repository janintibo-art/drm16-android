# Coque de bureau : exactement le même rôle que MainActivity.java côté Android
# — une fenêtre, un moteur web, et rien d'autre. Tout est dans le HTML.
[package]
name = "drm16"
version = "236.0.0"   # recopie de app/build.gradle par bureau/preparer.sh
edition = "2021"
description = "Boites a rythmes et samplers autonomes"
authors = ["tibo"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# pont de la page (v139) : arguments en JSON, fichiers en Base64, dossiers usuels
serde_json = "1"
base64 = "0.22"
dirs = "5"
# téléchargements archive.org (v140) : client HTTPS simple et bloquant, sur un fil à part
ureq = "2"
# MIDI (v141) : ports d'entrée et de sortie de Windows (WinMM)
midir = "0.10"

# On vise le plus petit exécutable possible : le projet tient en 2 Mo sur
# Android, on ne va pas en livrer 150 sur PC.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
